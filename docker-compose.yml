services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - todo-data:/app/data
    environment:
      - DATABASE_URL=file:/app/data/todos.db
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  todo-data:
